[project]
name = "decision-model-factory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Factories need flyte>=2.10 + flyteplugins-union>=0.12.
    "flyte>=2.10.0",
    "flyteplugins-union>=0.12.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pytest>=8",
]

# The trainer/eval stacks are installed in their task images, not locally.
[project.optional-dependencies]
train = [
    "torch>=2.6",
    "transformers>=4.57",
    "trl>=0.21",
    "peft>=0.13",
    "datasets>=3.2",
    "accelerate>=1.0",
]

[dependency-groups]
# The serving app is exercised by the unit tests with a stub policy, so the
# web stack is a dev dependency too.
dev = [
    "fastapi>=0.115",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
