name: CI

# Tests run on every push/PR; a green main additionally deploys every team's
# deploy unit to the cluster in .flyte/config.yaml (demo.hosted.unionai.cloud).
# Pattern adapted from unionai/unionai-agents .github/workflows.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also deploy after tests pass"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # A superseded PR run has nothing to tell us, but never cancel a deploy
  # in flight on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Unit tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [basic-model-factory, resource-tuner-model-factory]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      # --frozen first so a stale lockfile fails loudly rather than being
      # silently re-resolved; fall back so a dependency bump is not blocked
      # on relocking in the same commit. Default groups only: the private
      # `metrics` extra needs GitHub credentials CI doesn't have.
      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Run tests
        run: uv run pytest -v

  deploy:
    name: Deploy ${{ matrix.unit }}
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # One entry per deploy unit (see each project's README). A team's
          # file exposes the env(s) that anchor its tasks and triggers.
          - unit: data
            directory: basic-model-factory
            file: team_data.py
            env: de_cpu_env
          - unit: training
            directory: basic-model-factory
            file: team_training.py
            env: trainer_env
          - unit: eval
            directory: basic-model-factory
            file: team_eval.py
            env: eval_gpu_env
          - unit: inference-app
            directory: basic-model-factory
            file: team_inference.py
            env: inference_app_env
          - unit: inference-ops
            directory: basic-model-factory
            file: team_inference.py
            env: inference_ops_env
          - unit: lineage-app
            directory: basic-model-factory
            file: app.py
            env: lineage_app_env
          # resource-tuner: one deploy unit (driver_env depends_on the
          # trainer + harness envs, so the whole factory ships together).
          # Deployed without RT_USE_SECRETS until HUGGINGFACE_TOKEN /
          # WANDB_API_KEY exist in the resource-tuner-model-factory project
          # (cluster secrets are project-scoped; declaring missing ones
          # makes tasks unschedulable).
          - unit: resource-tuner
            directory: resource-tuner-model-factory
            file: main.py
            env: driver_env
    concurrency:
      group: deploy-${{ matrix.unit }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      # The flyte SDK picks this up for auth against admin.endpoint in
      # .flyte/config.yaml.
      FLYTE_API_KEY: ${{ secrets.DEMO_HOSTED_FLYTE_API_KEY }}
      # Sizing/accelerator profile for the demo tenant (the default, but be
      # explicit: a wrong profile deploys tasks that queue forever on an
      # accelerator the tenant doesn't have).
      MF_CLUSTER: demo
      # Attach the cluster-side HUGGINGFACE_TOKEN / WANDB_API_KEY secrets
      # (they exist in model-factory/development on this tenant). These are
      # Flyte secrets, not GitHub secrets — tasks mount them at runtime.
      MF_USE_SECRETS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.directory }}/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sanity check Flyte API key is set
        run: |
          if [[ -z "${FLYTE_API_KEY}" ]]; then
            echo "::error::Secret DEMO_HOSTED_FLYTE_API_KEY is empty or missing on this repo." >&2
            exit 1
          fi
          echo "FLYTE_API_KEY is set (length=${#FLYTE_API_KEY})."

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Deploy ${{ matrix.env }} from ${{ matrix.file }}
        # flyteplugins-union is public as of 0.10.0 and installed as a
        # normal dependency (pyproject + task images) — RT_GH_TOKEN is no
        # longer needed and the repo secret can be deleted.
        run: uv run flyte --config .flyte/config.yaml deploy ${{ matrix.file }} ${{ matrix.env }}
