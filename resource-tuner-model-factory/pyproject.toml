[project]
name = "resource-tuner-model-factory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flyte>=2.10.0",
    # 0.12.0+ ships factories (flyteplugins.union.factory) alongside the
    # Metrics interface (flyteplugins.union.remote).
    "flyteplugins-union>=0.12.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pytest>=8",
]

# The trainer/eval stacks are installed in their task images, not locally.
[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.57",
    "trl>=0.21",
    "peft>=0.13",
    "datasets>=3.2",
    "accelerate>=0.34",
]

[dependency-groups]
# The corpus templates import these; tests execute the templates for real.
dev = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "torch>=2.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
