[project]
name = "resource-tuner-model-factory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flyte>=2.6.7,<2.7.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pytest>=8",
]

# The trainer/eval stacks are installed in their task images, not locally.
# Local extras exist for running bits of the loop on your machine.
[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.57",
    "trl>=0.21",
    "peft>=0.13",
    "datasets>=3.2",
    "accelerate>=0.34",
]
# flyteplugins-union is PRIVATE (unionai/flyteplugins-union@niels/get-metrics);
# installing this extra needs GitHub credentials with access to that repo.
metrics = [
    "flyteplugins-union",
]

[tool.uv.sources]
flyteplugins-union = { git = "https://github.com/unionai/flyteplugins-union.git", branch = "niels/get-metrics" }

[dependency-groups]
# The corpus templates import these; tests execute the templates for real.
dev = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "torch>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
